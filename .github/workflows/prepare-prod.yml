name: Prepare Production

on:
  push:
    branches:
      - dev

jobs:
  prepare-prod:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Update existing PR or create a new one
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const latestRelease = await (async () => {
              try {
                const response = await github.rest.repos.getLatestRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });

                return response;
              } catch (error) {
                return null;
              }
            })();

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'prod',
              head: 'dev',
              state: 'open'
            });
            
            const lastPR = pullRequests[0];
            
            const [major, minor, fix] = latestRelease?.data ? latestRelease.data.name.replace('v', '').split('.').map(Number) : [0, 1, 0];
            const isFeature = context.payload.head_commit.message.includes('feat') || lastPR?.body.includes('feat');
            const newVersion = `v${major}.${minor + (isFeature ? 1 : 0)}.${isFeature ? 0 : (1 + fix)}`;

            if (pullRequests.length > 0) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: lastPR.number,
                title: newVersion,
                body: `-${context.payload.head_commit.message.split('\n')[0]}\n${lastPR.body}`
              });
            } else {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: 'prod',
                head: 'dev',
                title: newVersion,
                draft: true,
                body: `-${context.payload.head_commit.message.split('\n')[0]}`,
              });
            }
            
  update-coverage:
    name: Update coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test --coverage
        
      - name: Cache coverage report
        uses: actions/cache@v4
        with:
          path: coverage
          key: ${{ runner.os }}-coverage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Calculate coverage
        run: bun --filter scripts coverage